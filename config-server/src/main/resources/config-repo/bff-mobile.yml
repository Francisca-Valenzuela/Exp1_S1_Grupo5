server:
  port: 8082

spring:
  application:
    name: bff-mobile

# Nombres lógicos (Eureka) de los servicios que consume el canal Móvil
services:
  cuentas: cuentas-service
  core: banco-xyz-core

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - java.util.NoSuchElementException
    instances:
      cuentasService:
        base-config: default
      coreService:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: 2
        wait-duration: 500ms
        ignore-exceptions:
          - java.util.NoSuchElementException
    instances:
      cuentasService:
        base-config: default
      coreService:
        base-config: default
