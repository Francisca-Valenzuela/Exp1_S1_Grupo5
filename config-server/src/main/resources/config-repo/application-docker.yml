# Perfil "docker": dentro de la red de Docker los servicios se ubican por NOMBRE, no por localhost.
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Debe coincidir con AUTH_ISSUER del contenedor auth-server
          issuer-uri: http://auth-server:9000
          jwk-set-uri: http://auth-server:9000/oauth2/jwks
  kafka:
    bootstrap-servers: kafka:9092
