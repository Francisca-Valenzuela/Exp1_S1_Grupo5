# Configuración COMÚN a todos los microservicios que consultan el Config
# Server (banco-xyz-core, bff-web, bff-mobile, bff-atm). Cada uno puede
# sobrescribir estos valores en su propio <spring.application.name>.yml.

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always

# Validación de tokens OAuth2.0 (Resource Server) en los 3 BFF.
# jwk-set-uri: clave pública que publica auth-server.
# issuer-uri: se usa solo para validar el claim "iss" (no hace discovery al arrancar).
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
          jwk-set-uri: http://localhost:9000/oauth2/jwks

# Clave compartida simple para las llamadas internas BFF -> core
# (autenticación de servicio a servicio).
internal:
  api-key: banco-xyz-internal-2026

