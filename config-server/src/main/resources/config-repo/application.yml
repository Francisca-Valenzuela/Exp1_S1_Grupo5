# Configuración COMÚN a todos los microservicios (se combina con <spring.application.name>.yml).

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Monitoreo: health (healthcheck de Docker), métricas, formato Prometheus y estado de los circuit breakers.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: never
  health:
    circuitbreakers:
      enabled: true

# Seguridad distribuida: todos los servicios son Resource Servers y validan los JWT de auth-server.
# jwk-set-uri: clave pública de auth-server. issuer-uri: solo valida el claim "iss" (sin discovery al arrancar).
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
          jwk-set-uri: http://localhost:9000/oauth2/jwks
  # Apache Kafka (valores por defecto para ejecución local fuera de Docker)
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      acks: all
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
      missing-topics-fatal: false
