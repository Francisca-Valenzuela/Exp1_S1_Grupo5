server:
  port: 8443
  ssl:
    enabled: false   # TLS terminado en el borde (API Gateway / ALB en AWS). Ver keystore.p12 para reactivarlo.

spring:
  application:
    name: banco-xyz-core

# Spring Batch: escalado, finalización y reejecución automática
batch:
  partition:
    grid-size: 3
  skip-limit: 300
  chunk-size: 50
  chunk-timeout-ms: 5000
  restart:
    max-attempts: 3
    delay-ms: 5000
  run-on-startup: true
