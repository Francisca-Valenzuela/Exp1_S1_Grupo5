server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Los archivos de configuración de cada microservicio viven en
          # config-repo/ (dentro de este mismo proyecto). Para producción,
          # se puede reemplazar este bloque "native" por un backend git,
          # por ejemplo el config-repo de referencia de la guía:
          # spring:
          #   cloud:
          #     config:
          #       server:
          #         git:
          #           uri: https://github.com/<tu-org>/banco-xyz-config-repo
          #           default-label: main
          search-locations: classpath:/config-repo

# El propio Config Server también se registra en Eureka para que quede
# visible/monitoreable desde el dashboard del Service Discovery.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
