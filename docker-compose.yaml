# =============================================================================
# Banco XYZ - Orquestación completa (Semana 8)
# Levanta infraestructura + Spring Cloud + seguridad OAuth2 + microservicios:
#
#   docker compose up -d --build
#
# Orden de arranque (depends_on + healthcheck):
#   postgres / artemis / eureka -> config-server -> auth-server -> core -> BFFs
# =============================================================================
name: banco-xyz

x-java-service: &java-service
  restart: on-failure
  networks: [banco-xyz-net]

x-healthcheck: &hc
  interval: 10s
  timeout: 5s
  retries: 15
  start_period: 40s

services:
  # ---------------------------- Infraestructura ----------------------------
  banco-xyz-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bancoxyz
      POSTGRES_USER: bancoxyz
      POSTGRES_PASSWORD: bancoxyz123
    ports:
      - "5432:5432"
    volumes:
      - banco-xyz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancoxyz -d bancoxyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [banco-xyz-net]

  banco-xyz-artemis:
    image: apache/activemq-artemis:latest-alpine
    environment:
      ARTEMIS_USER: bancoxyz
      ARTEMIS_PASSWORD: bancoxyz123
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 61616 || exit 1"]
      <<: *hc
    networks: [banco-xyz-net]

  # ------------------------------ Spring Cloud -----------------------------
  eureka-server:
    <<: *java-service
    build: ./eureka-server
    image: banco-xyz/eureka-server:1.0
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8761/actuator/health || exit 1"]
      <<: *hc

  config-server:
    <<: *java-service
    build: ./config-server
    image: banco-xyz/config-server:1.0
    environment:
      # El config-server usa el backend "native"; el perfil "docker" lo piden
      # los clientes (aquí NO se activa para no pisar "native").
      SPRING_PROFILES_ACTIVE: native
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    ports:
      - "8888:8888"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8888/actuator/health || exit 1"]
      <<: *hc

  # ---------------------------- Seguridad OAuth2.0 -------------------------
  auth-server:
    <<: *java-service
    build: ./auth-server
    image: banco-xyz/auth-server:1.0
    environment:
      # Claim "iss" de los tokens; debe coincidir con issuer-uri de los BFF
      AUTH_ISSUER: http://auth-server:9000
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9000/.well-known/oauth-authorization-server || exit 1"]
      <<: *hc

  # ------------------------------ Microservicios ---------------------------
  banco-xyz-core:
    <<: *java-service
    build: ./banco-xyz-core
    image: banco-xyz/banco-xyz-core:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      SPRING_DATASOURCE_URL: jdbc:postgresql://banco-xyz-postgres:5432/bancoxyz
      SPRING_ARTEMIS_BROKER_URL: tcp://banco-xyz-artemis:61616
    ports:
      - "8443:8443"
    depends_on:
      banco-xyz-postgres:
        condition: service_healthy
      banco-xyz-artemis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8443/actuator/health || exit 1"]
      <<: *hc
      start_period: 90s

  bff-web:
    <<: *java-service
    build: ./bff-web
    image: banco-xyz/bff-web:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
    ports:
      - "8081:8081"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      banco-xyz-core:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      <<: *hc

  bff-mobile:
    <<: *java-service
    build: ./bff-mobile
    image: banco-xyz/bff-mobile:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
    ports:
      - "8082:8082"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      banco-xyz-core:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      <<: *hc

  bff-atm:
    <<: *java-service
    build: ./bff-atm
    image: banco-xyz/bff-atm:1.0
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: "configserver:http://config-server:8888"
      SPRING_ARTEMIS_BROKER_URL: tcp://banco-xyz-artemis:61616
    ports:
      - "8083:8083"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      banco-xyz-artemis:
        condition: service_healthy
      banco-xyz-core:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8083/actuator/health || exit 1"]
      <<: *hc

networks:
  banco-xyz-net:
    driver: bridge

volumes:
  banco-xyz-postgres-data:
