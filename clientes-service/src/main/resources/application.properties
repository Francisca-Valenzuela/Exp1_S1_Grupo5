spring.application.name=clientes-service
spring.config.import=optional:configserver:http://localhost:8888

# Base de datos propia (database-per-service). En Docker se sobrescribe por variables de entorno.
spring.datasource.url=jdbc:postgresql://localhost:5436/clientes_db
spring.datasource.username=clientes
spring.datasource.password=clientes123
spring.jpa.hibernate.ddl-auto=update

# Respaldo local (config-server entrega los valores reales)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks
spring.kafka.bootstrap-servers=localhost:29092
