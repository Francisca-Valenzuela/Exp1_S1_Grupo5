spring.application.name=banco-xyz-core

# --- Config Server (Semana 6) ---
# "optional:" evita que el arranque falle si config-server aun no esta arriba
# (por ejemplo, la primera vez que se levanta el ecosistema).
spring.config.import=optional:configserver:http://localhost:8888

spring.batch.job.enabled=false
# Evita que el job se dispare automaticamente en cada arranque si mas adelante quieres controlarlo por parametros
spring.batch.jdbc.initialize-schema=always

# PostgreSQL (via Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/bancoxyz
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=bancoxyz
spring.datasource.password=bancoxyz123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Optimizacion de recursos (Semana 2) ---
# el pool de conexiones debe acompanar el paralelismo: 3 hilos batch + margen
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000

# logs para trazar rendimiento y ejecucion de Spring Batch
logging.level.com.duoc.bancoxyzbatch=INFO
logging.level.org.springframework.batch=INFO

# --- Escalado con particiones (Semana 3) ---
# valores por defecto; config-server (banco-xyz-core.yml) puede sobrescribirlos
batch.partition.grid-size=3
batch.skip-limit=300

# --- Optimizacion de respuestas por canal ---
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=512

# server.port y server.ssl.* ahora los entrega config-server
# (ver config-repo/banco-xyz-core.yml). Localmente NO se declaran para que
# no choquen con lo que llega centralizado.

# --- Seguridad de servicio a servicio (Semana 6) ---
# Clave simple que valida que las llamadas a /internal/** vienen de un BFF
# autorizado del ecosistema. El valor real (compartido) lo entrega
# config-server; este es solo un respaldo si config-server no responde.
internal.api-key=banco-xyz-internal-2026
