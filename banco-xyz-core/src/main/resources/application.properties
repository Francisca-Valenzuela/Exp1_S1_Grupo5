spring.application.name=banco-xyz-core

# --- Config Server (Semana 6) ---
# "optional:" evita que el arranque falle si config-server aun no esta arriba
# (por ejemplo, la primera vez que se levanta el ecosistema).
spring.config.import=optional:configserver:http://localhost:8888

spring.batch.job.enabled=false
# Evita que el job se dispare automaticamente en cada arranque si mas adelante quieres controlarlo por parametros
spring.batch.jdbc.initialize-schema=always

# PostgreSQL (via Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/bancoxyz
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=bancoxyz
spring.datasource.password=bancoxyz123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Optimizacion de recursos (Semana 2) ---
# el pool de conexiones debe acompanar el paralelismo: 3 hilos batch + margen
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000

# logs para trazar rendimiento y ejecucion de Spring Batch
logging.level.com.duoc.bancoxyzbatch=INFO
logging.level.org.springframework.batch=INFO

# --- Escalado con particiones (Semana 3) ---
# valores por defecto; config-server (banco-xyz-core.yml) puede sobrescribirlos
batch.partition.grid-size=3
batch.skip-limit=300

# --- Optimizacion de respuestas por canal ---
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=512

# server.port y server.ssl.* ahora los entrega config-server
# (ver config-repo/banco-xyz-core.yml). Localmente NO se declaran para que
# no choquen con lo que llega centralizado.

# --- Seguridad (Semana 8/9): OAuth2.0 Resource Server ---
# El core valida los JWT emitidos por auth-server. Los valores reales
# (issuer-uri y jwk-set-uri) los entrega config-server (config-repo/application.yml);
# estos son el respaldo para ejecucion local si config-server no responde.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/oauth2/jwks

# --- Apache Kafka (Semana 9): reemplaza al broker JMS/Artemis ---
# 29092 = listener EXTERNAL del broker para ejecucion fuera de Docker; en Docker
# lo sobrescribe config-repo/application-docker.yml (kafka:9092).
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.admin.fail-fast=false

# --- Batch: optimizacion, finalizacion y reejecucion automatica (Semana 9) ---
batch.chunk-size=50
batch.chunk-timeout-ms=5000
batch.restart.max-attempts=3
batch.restart.delay-ms=5000
batch.run-on-startup=true

# --- Monitoreo ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
